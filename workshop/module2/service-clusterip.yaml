# ClusterIP (default type)
# Exposes the pod on an internal-only IP address, reachable only from within
# the cluster (other pods, other services). Not accessible from outside the
# cluster at all — no external IP is assigned. Typically used for internal
# communication between services/microservices, or paired with an Ingress
# for controlled external access.
apiVersion: v1
kind: Service
metadata:
  name: podinfo-clusterip
spec:
  type: ClusterIP
  selector:
    app: podinfo
    purpose: workshop
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080

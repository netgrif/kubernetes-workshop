# Kubernetes probes are health checks that Kubernetes runs against a container to know its state. Three types:
#  - Liveness probe — "Is this container still alive?" If it fails, Kubernetes restarts the container.
#  - Readiness probe — "Is this container ready to accept traffic?" If it fails, Kubernetes removes it from Service
#    load-balancing (but doesn't restart it).
#  - Startup probe — "Has this container finished starting up yet?" Delays the other probes until the app has had time
#    to boot (useful for slow-starting apps).
#
#  Checks can be done via an HTTP request, a TCP connection, or running a command inside the container.
#  Analogy: Liveness = "are you breathing?" (if not, resuscitate). Readiness = "are you ready for customers?"
#   (if not, put up the "closed" sign but don't call an ambulance).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app: podinfo
    purpose: workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
      purpose: workshop
  template:
    metadata:
      labels:
        app: podinfo
        purpose: workshop
    spec:
      containers:
        - name: podinfo
          image: netgrif/podinfo:latest
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5

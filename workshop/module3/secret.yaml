#  A Secret is like a ConfigMap, but for sensitive data — passwords, API keys, tokens, certificates.
#
#  Key points:
#    - Stored base64-encoded (not encrypted by default — just encoded, so don't treat it as secure on its own)
#    - Can be injected into pods as environment variables or mounted files, same as ConfigMaps
#    - Kubernetes avoids writing them to disk unnecessarily and keeps them out of regular `kubectl` logs/describe output
#
#  Note: For real security, pair Secrets with encryption at rest, RBAC access controls, or an external secrets manager
#  (like Vault or AWS Secrets Manager) — the base64 encoding alone isn't protection.
apiVersion: v1
kind: Secret
metadata:
  name: podinfo-secret
type: Opaque
data:
  secret_key: aGVsbG8=

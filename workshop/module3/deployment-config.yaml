apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  labels:
    app: podinfo
    purpose: workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
      purpose: workshop
  template:
    metadata:
      labels:
        app: podinfo
        purpose: workshop
    spec:
      containers:
        - name: podinfo
          image: netgrif/podinfo:latest
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOG_DIR
              value: /app/data
            # Pull individual keys from ConfigMap as env vars
            - name: GREETING
              valueFrom:
                configMapKeyRef:
                  name: podinfo-config
                  key: GREETING
            # Pull individual keys from Secret as env vars
            - name: SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: podinfo-secret
                  key: secret_key
          volumeMounts:
            - name: config-volume
              mountPath: /app/mnt/config
            - name: secret-volume
              mountPath: /app/mnt/secret
              readOnly: true
            - name: logs
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
      volumes:
        - name: config-volume
          configMap:
            name: podinfo-config
        - name: secret-volume
          secret:
            secretName: podinfo-secret
        - name: logs
          persistentVolumeClaim:
            claimName: podinfo-log-pvc

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: podinfo
  labels:
    app: podinfo
    purpose: workshop
    step: "4"
spec:
  serviceName: podinfo-headless
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
      purpose: workshop
      step: "4"
  template:
    metadata:
      labels:
        app: podinfo
        purpose: workshop
        step: "4"
    spec:
      containers:
        - name: podinfo
          image: netgrif/podinfo:latest
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOG_DIR
              value: /app/data
          volumeMounts:
            - name: log-storage
              mountPath: /app/data
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: log-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 100Mi

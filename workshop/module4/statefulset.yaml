# A StatefulSet is like a Deployment, but for apps that need stable identity and persistent state — think databases
# (MySQL, MongoDB, Kafka, etc.).
# Key differences from a Deployment:
#  - Stable, unique pod names — pods get predictable names like `app-0`, `app-1`, `app-2` (not random hashes),
#    and keep that identity even after restarts
#  - Stable storage — each pod gets its own PVC that persists and reattaches to the *same* pod identity, even if
#    it's rescheduled
#  - Ordered deployment/scaling — pods are created, updated, and deleted one at a time, in order (0, 1, 2...),
#    not all at once
#
# Use it for: anything where pods aren't interchangeable clones — e.g., database replicas that each need to remember
# "which one am I" and keep their own data.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: podinfo
  labels:
    app: podinfo
    purpose: workshop
    step: "4"
spec:
  serviceName: podinfo-headless
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
      purpose: workshop
      step: "4"
  template:
    metadata:
      labels:
        app: podinfo
        purpose: workshop
        step: "4"
    spec:
      containers:
        - name: podinfo
          image: netgrif/podinfo:latest
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: LOG_DIR
              value: /app/data
          volumeMounts:
            - name: log-storage
              mountPath: /app/data
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: log-storage
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 100Mi

name: Publish podinfo docker image

on:
  workflow_dispatch:


jobs:
  docker-build:
    name: Docker build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get version
        uses: zvonimirsun/read-package-version-actions@v2
        with:
          path: ./podinfo
        id: get_version
      - name: Get short SHA
        id: short
        run: |
          short=$(git rev-parse --short HEAD)
          echo "::set-output name=sha::$short"
      - name: Get current date
        id: date
        run: |
          date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "::set-output name=date::$date"

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_AUTH_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./podinfo
          file: ./podinfo/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: netgrif/podinfo:${{ steps.get_version.outputs.version }},netgrif/podinfo:latest
          build-args: |
            VERSION=${{ steps.get_version.outputs.version }}
            VCS_REF=${{ steps.short.outputs.sha }}
            BUILD_DATE=${{ steps.date.outputs.date }}



name: Publish podinfo docker image

on:
  workflow_dispatch:


jobs:
  docker-build:
    name: Docker build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get version
        uses: zvonimirsun/read-package-version-actions@v2
        id: get_version

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./podinfo
          file: ./podinfo/Dockerfile
          push: true
          platforms:
            - linux/amd64
            - linux/arm64
          tags:
            - netgrif/podinfo:${{ steps.get-version.outputs.version }}
            - netgrif/podinfo:latest
          build-args:
            - "VERSION=${{ steps.get-version.outputs.version }}"
            - "VCS_REF=${{ github.sha }}"
            - "BUILD_DATE=${{ github.event.created_at }}"


